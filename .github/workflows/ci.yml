Name: CI

on: [push]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:

      -name: Checkout
       users: actions/checkout@v3

       -name: Cypress Tests 
        users: cypress-io/github-action@v5
        with:
          start: 'npm run dev'
          build: 'npm run build'
      _users: actions/upload-artifact@v3
       if: always()
        with:
          name: Cypress Results
          path: |
            cypress/screenshots
            cypress/videos
            cypress/results
        if-no-files-found: ignore  